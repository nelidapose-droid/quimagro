<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuimAgro</title>
<meta name="theme-color" content="#15795F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuimAgro">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --ink:#16241E; --paper:#F1F3EE; --paper-2:#E7EAE2;
    --primary:#15795F; --primary-dk:#0F5B47; --clay:#C2683C;
    --ok:#2E9E5B; --ok-bg:#E2F3E7; --no:#D7493A; --no-bg:#FBE6E2;
    --lock:#AEB8B0; --line:#D3DAD2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#cdd3cb;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:412px;height:100vh;max-height:880px;background:var(--paper);
    position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28)}
  @media(min-width:430px){ #app{border-radius:34px;height:88vh} }

  .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;
    border-bottom:1px solid var(--line);background:var(--paper);flex-shrink:0}
  .pill{display:flex;align-items:center;gap:5px;font-weight:600;font-size:15px}
  .pill .ico{font-size:17px}
  .pill.streak{color:var(--clay)} .pill.xp{color:var(--primary)} .pill.heart{color:var(--no)}
  .brand{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:20px;letter-spacing:-.5px;margin-right:auto}
  .brand b{color:var(--primary)}

  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .pad{padding:18px 18px 96px}
  .eyebrow{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:600;
    letter-spacing:1.5px;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
  .h-title{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.5px}
  .note{margin:14px 0 22px;padding:12px 14px;border-radius:14px;background:#FBF6E9;
    border:1px dashed #D9C58E;font-size:13px;line-height:1.45;color:#5b5230}
  .note b{color:#8a6d1f}

  .path{position:relative;padding:6px 0 10px}
  .node-row{display:flex;justify-content:center;position:relative;padding:13px 0}
  .node-row::before{content:"";position:absolute;top:-13px;bottom:-13px;left:50%;width:4px;
    background:var(--line);transform:translateX(-50%);z-index:0}
  .node-row:first-child::before{top:50%} .node-row:last-child::before{bottom:50%}
  .node{position:relative;z-index:1;width:130px;text-align:center;cursor:pointer;background:transparent;border:none}
  .node[disabled]{cursor:default}
  .disc{width:74px;height:74px;border-radius:22px;margin:0 auto 7px;display:flex;align-items:center;
    justify-content:center;font-size:30px;color:#fff;font-weight:700;border:3px solid rgba(0,0,0,.08);
    box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .12s ease}
  .node:not([disabled]):active .disc{transform:translateY(2px)}
  .disc.done{background:var(--primary)}
  .disc.active{background:var(--clay);animation:pulse 1.8s infinite}
  .disc.soon{background:#DCE0D9;color:var(--lock);box-shadow:0 4px 0 #c7cdc4;opacity:.6;filter:grayscale(.5)}
  .disc.play{position:relative}
  .disc.play::after{content:"\25B6";position:absolute;bottom:-4px;right:-4px;font-size:11px;
    background:#fff;color:var(--primary);width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  @keyframes pulse{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.14)}
    50%{box-shadow:0 4px 0 rgba(0,0,0,.14),0 0 0 7px rgba(194,104,60,.18)}}
  .node-lbl{font-size:12.5px;font-weight:600;line-height:1.2}
  .node.is-soon .node-lbl{color:#97a199}
  .node-sub{font-size:10.5px;color:#6c7770;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;margin-top:2px}
  .offset-l{transform:translateX(-54px)} .offset-r{transform:translateX(54px)}

  .start-cta{position:absolute;left:18px;right:18px;bottom:16px;background:var(--clay);color:#fff;
    border:none;padding:16px;border-radius:16px;font-weight:700;font-size:16px;
    letter-spacing:.3px;box-shadow:0 4px 0 #9c5230;cursor:pointer}
  .start-cta:active{transform:translateY(2px);box-shadow:0 2px 0 #9c5230}

  .lesson-top{display:flex;align-items:center;gap:12px;padding:14px 18px 6px;flex-shrink:0}
  .xclose{background:none;border:none;font-size:24px;color:#9aa49c;cursor:pointer;line-height:1}
  .prog-track{flex:1;height:14px;background:var(--paper-2);border-radius:20px;overflow:hidden}
  .prog-fill{height:100%;background:var(--primary);border-radius:20px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .lives{display:flex;gap:3px;color:var(--no);font-size:16px}
  .lives .dead{color:#D5DBD4}

  .q-area{padding:8px 20px 20px}
  .q-kind{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--clay);margin:10px 0 6px}
  .q-text{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.3px}
  .q-context{margin:12px 0;padding:13px 15px;border-radius:14px;background:#fff;border:1px solid var(--line);
    font-size:14px;line-height:1.5}
  .q-context .data{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:600;color:var(--primary-dk)}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .opt{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;padding:15px 16px;
    font-size:15px;font-weight:500;text-align:left;cursor:pointer;color:var(--ink);
    transition:border-color .1s, background .1s}
  .opt:active{transform:translateY(1px)}
  .opt.sel{border-color:var(--primary);background:#E9F4F0}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrong{border-color:var(--no);background:var(--no-bg)}
  .opt .tag{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:#8a948c;margin-right:8px}

  .numwrap{margin-top:18px;display:flex;align-items:stretch;gap:10px}
  .numwrap input{flex:1;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:600;padding:14px 16px;
    border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;background:#fff;color:var(--ink);min-width:0}
  .numwrap input:focus{outline:none;border-color:var(--primary)}
  .unit-badge{display:flex;align-items:center;padding:0 16px;border-radius:15px;background:var(--paper-2);
    font-weight:600;font-size:16px;color:#5b665e;white-space:nowrap}

  .curve-wrap{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 8px 4px}
  .curve-hint{font-size:12px;color:#6c7770;text-align:center;margin-top:2px}

  .footer{flex-shrink:0;border-top:1px solid var(--line);background:var(--paper);
    padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
  .fb{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.45;display:none}
  .fb.show{display:block;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fb.ok{background:var(--ok-bg);color:#1d6b3c} .fb.no{background:var(--no-bg);color:#9c2c20}
  .fb .head{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:3px;font-size:15px}
  .fb .why b{font-weight:600}
  .btn{width:100%;border:none;border-radius:15px;padding:15px;font-weight:700;
    font-size:16px;letter-spacing:.3px;cursor:pointer;color:#fff}
  .btn.check{background:var(--primary);box-shadow:0 4px 0 var(--primary-dk)}
  .btn.check:disabled{background:#C2CBC4;box-shadow:0 4px 0 #aab4ac;cursor:not-allowed}
  .btn.next-ok{background:var(--ok);box-shadow:0 4px 0 #1f7a44}
  .btn.next-no{background:var(--no);box-shadow:0 4px 0 #a8362a}
  .btn:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-dk)}

  .summary{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px}
  .sum-title{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:600;letter-spacing:-.5px}
  .sum-sub{color:#5d685f;font-size:15px;margin:6px 0 26px}
  .stat-row{display:flex;gap:12px;width:100%;max-width:320px;margin-bottom:28px}
  .stat{flex:1;border-radius:16px;padding:14px 8px;border:2px solid var(--line);background:#fff}
  .stat .v{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:24px;font-weight:600}
  .stat .l{font-size:11px;color:#6c7770;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
  .stat.xp .v{color:var(--primary)} .stat.acc .v{color:var(--clay)} .stat.hp .v{color:var(--no)}
  .gameover{color:var(--no)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Quim<b>Agro</b></div>
    <div class="pill streak"><span class="ico">&#128293;</span><span id="streak">0</span></div>
    <div class="pill xp"><span class="ico">&#9889;</span><span id="xptop">0</span></div>
    <div class="pill heart"><span class="ico">&#10084;</span><span id="hptop">5</span></div>
  </div>

  <!-- MAP -->
  <div class="screen" id="screen-map">
    <div class="pad">
      <div class="eyebrow">Introducción a la Química · práctica libre</div>
      <div class="h-title">Ruta de la materia</div>
      <div class="note">
        <b>Práctica libre:</b> tocá cualquier unidad para practicar, en el orden que quieras.
        Cada una sigue la Guía de Trabajos Prácticos de la cátedra. Tu progreso se guarda en este dispositivo.
      </div>
      <div class="path" id="path"></div>
    </div>
    <button class="start-cta" id="cta" onclick="startLesson('ph')">Sugerido hoy · Cálculo de pH</button>
  </div>

  <!-- LESSON -->
  <div class="screen hidden" id="screen-lesson" style="display:flex;flex-direction:column">
    <div class="lesson-top">
      <button class="xclose" onclick="quitLesson()">&times;</button>
      <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
      <div class="lives" id="lives"></div>
    </div>
    <div class="q-area" id="qArea" style="flex:1;overflow-y:auto"></div>
    <div class="footer">
      <div class="fb" id="fb"></div>
      <button class="btn check" id="actionBtn" onclick="onAction()" disabled>Comprobar</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="screen hidden" id="screen-sum"><div class="summary" id="sumInner"></div></div>
</div>

<script>
/* ===================== UNIDADES (Guía TP 2026, sin Conceptos básicos) ===================== */
const UNITS = [
  {id:'uq',  name:'Uniones · geometría',  sub:'TP 2 · jugar', icon:'\u269B', status:'play'},
  {id:'gas', name:'Estado gaseoso',       sub:'TP 3 · jugar', icon:'\uD83C\uDF2C', status:'play'},
  {id:'tq',  name:'Termoquímica',         sub:'TP 4 · jugar', icon:'\uD83D\uDD25', status:'play'},
  {id:'sol', name:'Concentración',        sub:'TP 5a · jugar',icon:'\uD83E\uDDEA', status:'play'},
  {id:'slb', name:'Solubilidad',          sub:'TP 5b · jugar',icon:'\uD83D\uDCC8', status:'play'},
  {id:'eq',  name:'Equilibrio químico',   sub:'TP 6 · jugar', icon:'\u2696', status:'play'},
  {id:'ph',  name:'Cálculo de pH',        sub:'TP 7 · jugar', icon:'\uD83D\uDCA7', status:'play'},
  {id:'rdx', name:'Redox',                sub:'TP 8 · jugar', icon:'\u26A1', status:'play'},
  {id:'cel', name:'Celdas electroquím.',  sub:'TP 9 · jugar', icon:'\uD83D\uDD0B', status:'play'},
];

/* ===================== CONTENIDO (extraído de la Guía de TP) ===================== */
const QUESTIONS = {
  /* ---------- ESTADO GASEOSO ---------- */
  gas:[
    { kind:'mc', label:'Concepto',
      text:'¿Cuál es la ecuación de los gases ideales?',
      options:['P · V = n · R · T','P / V = n · R · T','P · V = n · R / T','P = n · R · T · V'],
      answer:0,
      why:'<b>P·V = n·R·T</b>. Con R = 0,082 L·atm/(mol·K), P va en atm, V en L y T en <b>kelvin</b>.' },
    { kind:'num', label:'Unidades',
      text:'En PV = nRT la temperatura SIEMPRE va en kelvin.',
      context:'Un silo experimental está a <span class="data">27 °C</span>. ¿Cuántos K son?',
      unit:'K', answer:300, tol:0.5,
      why:'K = °C + 273 → 27 + 273 = <b>300 K</b>. Olvidar este pasaje es el error que más “rompe” los problemas de gases.' },
    { kind:'mc', label:'Mezclas de gases',
      text:'En una mezcla de gases ideales (ley de Dalton), la presión total es…',
      options:['la suma de las presiones parciales','el promedio de las presiones parciales',
               'la presión del gas más abundante','la del gas de mayor masa molar'],
      answer:0,
      why:'Ley de Dalton: P<sub>total</sub> = ΣP<sub>i</sub>. Cada gas aporta su <b>presión parcial</b>; se suman.' },
    { kind:'mc', label:'Concepto',
      text:'¿Qué significa que un gas esté en CNPT (condiciones normales de presión y temperatura)?',
      options:['1 atm y 0 °C (273 K)','1 atm y 25 °C','760 atm y 0 °C','Presión y temperatura ambiente'],
      answer:0,
      why:'CNPT = <b>1 atm y 273 K (0 °C)</b>. En esas condiciones, 1 mol de gas ideal ocupa 22,4 L: el “volumen molar”.' },
    { kind:'mc', label:'Concepto',
      text:'Dos recipientes iguales, a igual P y T, contienen uno CO₂ y otro CH₄. ¿Cuál tiene más moléculas?',
      options:['Tienen la misma cantidad de moléculas','El de CO₂, porque pesa más','El de CH₄, porque es más liviano','No se puede saber'],
      answer:0,
      why:'Principio de Avogadro: a igual <b>V, P y T</b>, igual número de moléculas, sin importar cuál sea el gas. Lo que cambia es la <b>masa</b>, no la cantidad.' },
    { kind:'mc', label:'Concepto',
      text:'¿En qué condiciones un gas real se aleja MÁS del comportamiento ideal?',
      options:['Alta presión y baja temperatura','Baja presión y alta temperatura','Siempre se comporta igual','Solo si es un gas noble'],
      answer:0,
      why:'A <b>alta P y baja T</b> las moléculas están cerca y lentas: pesan el volumen propio y las fuerzas intermoleculares, que el modelo ideal desprecia.' },
    { kind:'scaffold-step', step:'1 de 3', label:'Problema · gas del suelo',
      text:'Un agrónomo recolecta un gas liberado por el suelo y mide su masa molar para identificarlo.',
      context:'Recipiente: <span class="data">250 mL</span> · <span class="data">760 torr</span> (= 1 atm) · <span class="data">25 °C</span> · masa = <span class="data">0,164 g</span>.<br>Paso 1: pasá la temperatura a kelvin.',
      unit:'K', answer:298, tol:0.5,
      why:'25 + 273 = <b>298 K</b>. Antes de la fórmula, ordenás unidades: V = 0,250 L, P = 1 atm, T = 298 K.' },
    { kind:'scaffold-step', step:'2 de 3', label:'Problema · gas del suelo',
      text:'Calculá los moles de gas con n = P·V / (R·T).',
      context:'<span class="data">P = 1 · V = 0,250 · R = 0,082 · T = 298</span><br><span style="font-size:12.5px;color:#6c7770">n = (1 × 0,250) / (0,082 × 298)</span>',
      unit:'mol', answer:0.0102, tol:0.0005,
      why:'n = 0,250 / 24,44 = <b>0,0102 mol</b>. Con los moles y la masa sacás la masa molar.' },
    { kind:'mc', label:'Problema · gas del suelo',
      text:'Masa molar = masa / moles = 0,164 / 0,0102 ≈ 16 g/mol. ¿Qué gas es?',
      context:'Masas molares (g/mol): CO₂ = 44 · NH₃ = 17 · CH₄ = 16 · O₂ = 32',
      options:['Metano (CH₄) — suelos anegados','Dióxido de carbono (CO₂) — respiración microbiana',
               'Amoníaco (NH₃) — fertilización','Oxígeno (O₂)'],
      answer:0,
      why:'≈16 g/mol → <b>metano (CH₄)</b>, típico de suelos anegados. Identificaste el gas calculando su masa molar.' },
  ],

  /* ---------- SOLUCIONES: CONCENTRACIÓN ---------- */
  sol:[
    { kind:'mc', label:'Concepto',
      text:'¿Qué expresa la molaridad (M) de una solución?',
      options:['Moles de soluto por litro de solución','Gramos de soluto por litro de solvente',
               'Moles de soluto por kilo de solvente','Volumen de soluto sobre volumen de solución'],
      answer:0,
      why:'Molaridad = mol de soluto / L de <b>solución</b> (no de solvente). Confundir “solución” con “solvente” es de los errores más frecuentes.' },
    { kind:'mc', label:'Concepto',
      text:'Si a una solución le agregás solo AGUA, ¿qué pasa con los moles de soluto y con la molaridad?',
      options:['Moles iguales, molaridad disminuye','Moles bajan, molaridad igual','Ambos disminuyen','Ambos quedan igual'],
      answer:0,
      why:'Diluir <b>no saca soluto</b>: n constante. Pero V aumenta → M = n/V <b>disminuye</b>. Esta idea es la base de M₁V₁ = M₂V₂.' },
    { kind:'num', label:'Expresiones físicas · % m/m',
      text:'Se disuelven 45 g de ioduro de potasio en 80 g de agua. ¿Cuál es el % m/m?',
      context:'%m/m = masa de soluto / masa de solución × 100<br><span style="font-size:12.5px;color:#6c7770">masa de solución = soluto + solvente</span>',
      unit:'%', answer:36, tol:0.5,
      why:'45 / (45 + 80) × 100 = 45/125 × 100 = <b>36 %</b>. El denominador es la masa total, no solo el agua.' },
    { kind:'num', label:'Expresiones físicas · g/100 g solvente',
      text:'La MISMA solución (45 g de KI en 80 g de agua), expresada en g de soluto cada 100 g de SOLVENTE, ¿cuánto da?',
      context:'Regla de tres: si en <span class="data">80 g</span> de agua hay <span class="data">45 g</span> de soluto, en 100 g de agua hay…',
      unit:'g/100 g', answer:56.25, tol:0.5,
      why:'45 × 100 / 80 = <b>56,25 g/100 g de solvente</b>. Misma solución, número distinto que el %m/m (36): por eso SIEMPRE hay que mirar la base de cálculo.' },
    { kind:'num', label:'Expresiones físicas · ppm',
      text:'Una solución de cobre para uso hortícola tiene 0,454 g de Cu por litro. Expresala en ppm (mg/L).',
      context:'<span class="data">1 g = 1000 mg</span> · ppm en soluciones acuosas diluidas ≈ mg/L',
      unit:'ppm', answer:454, tol:2,
      why:'0,454 g/L × 1000 = <b>454 ppm</b>. Como el umbral fitotóxico del Cu ronda 0,3 ppm, esta solución concentrada jamás se aplica directa: se dosifica.' },
    { kind:'num', label:'Expresiones físicas · mezclas',
      text:'En un vivero se mezclan 200 g de solución de urea al 10 % m/m con 300 g de solución al 4 % m/m. ¿Cuál es el % m/m final?',
      context:'Soluto total = <span class="data">200×0,10 + 300×0,04</span> · masa total = <span class="data">500 g</span>',
      unit:'%', answer:6.4, tol:0.1,
      why:'(20 + 12) / 500 × 100 = <b>6,4 % m/m</b>. Se suman las masas de soluto, nunca se promedian los porcentajes directamente.' },
    { kind:'num', label:'Expresiones físicas · % m/V',
      text:'Para suplementación bovina se disuelven 150 g de NaCl en 350 g de agua. La densidad final es 1,15 g/mL. ¿Cuál es el % m/V?',
      context:'Volumen de solución = masa total / densidad = <span class="data">500 / 1,15</span> mL · %m/V = g soluto / 100 mL',
      unit:'% m/V', answer:34.5, tol:0.5,
      why:'V = 500/1,15 = 434,8 mL → 150/434,8 × 100 = <b>34,5 % m/V</b>. El %m/V necesita la <b>densidad</b> para pasar de masa a volumen: sin ella no se puede.' },
    { kind:'mc', label:'Contexto agronómico',
      text:'El KCl es fuente de potasio en fertirriego. ¿Cuál es su masa molar aproximada?',
      context:'Datos: K = 39,1 g/mol; Cl = 35,45 g/mol',
      options:['74,55 g/mol','39,10 g/mol','35,45 g/mol','110,0 g/mol'],
      answer:0,
      why:'M(KCl) = 39,10 + 35,45 = <b>74,55 g/mol</b>. Se suman las masas atómicas de la fórmula.' },
    { kind:'mc', label:'Normalidad · concepto',
      text:'¿Cómo se relaciona la Normalidad (N) con la Molaridad (M)?',
      options:['N = M × n° de equivalentes por mol (para H₂SO₄, N = 2M)','N = M ÷ 2 siempre','N y M son lo mismo','N = M × volumen'],
      answer:0,
      why:'<b>N = M × equivalentes</b>. El H₂SO₄ aporta 2 H⁺ por mol → N = 2M. Para un ácido con 1 H⁺ (HCl), N = M.' },
    { kind:'mc', label:'Normalidad',
      text:'Para una solución de cloruro de aluminio (AlCl₃), su Normalidad será…',

/* ----- PERSISTENCIA (guardada en este dispositivo) ----- */
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem('quimagro_v1')) || {}; }catch(e){ return {}; } },
  save(d){ try{ localStorage.setItem('quimagro_v1', JSON.stringify(d)); }catch(e){} }
};
let saved = store.load();
if(!saved.done) saved.done = {};
let totalXP = saved.xp || 0;
let streakVal = saved.streak || 0;
function dayStr(offset){ const d=new Date(); d.setDate(d.getDate()+(offset||0)); return d.toISOString().slice(0,10); }
function updateStreakOnComplete(){
  const today=dayStr(0);
  if(saved.lastDay===today) return;
  streakVal = (saved.lastDay===dayStr(-1)) ? streakVal+1 : 1;
  saved.lastDay=today; saved.streak=streakVal;
  $('streak').textContent=streakVal;
}

let curUnit=null, idx=0, lives=5, xp=0, answered=false, currentSel=null, list=[], currentOrder=[];
let curveState=null, curveDrag=false;

const $ = id => document.getElementById(id);
function show(s){ ['screen-map','screen-lesson','screen-sum'].forEach(x=>$(x).classList.add('hidden')); $(s).classList.remove('hidden'); }
function renderLives(){ let h=''; for(let i=0;i<5;i++) h+=`<span class="${i<lives?'':'dead'}">&#10084;</span>`; $('lives').innerHTML=h; $('hptop').textContent=lives; }

/* ----- MAP ----- */
function renderMap(){
  let h='';
  UNITS.forEach((u,i)=>{
    const side=i%2===0?'offset-l':'offset-r';
    const playable=!!QUESTIONS[u.id];
    let cls='disc ';
    if(u.featured) cls+='active'; else if(u.status==='play') cls+='done'; else cls+='soon';
    if(playable) cls+=' play';
    const nodeCls = u.status==='soon' ? 'node is-soon '+side : 'node '+side;
    h += `<div class="node-row"><button class="${nodeCls}" ${playable?`onclick="startLesson('${u.id}')"`:'disabled'}>
      <div class="${cls}">${u.icon}</div>
      <div class="node-lbl">${u.name}</div><div class="node-sub">${saved.done[u.id] ? u.sub.replace('jugar','✓ completada') : u.sub}</div>
    </button></div>`;
  });
  $('path').innerHTML=h;
}

/* ----- FLOW ----- */
function startLesson(uid){
  curUnit=uid; list=QUESTIONS[uid]; idx=0; lives=5; xp=0;
  $('xptop').textContent=totalXP; renderLives(); setProgress();
  show('screen-lesson'); renderQuestion();
}
function quitLesson(){ curveState=null; show('screen-map'); }
function setProgress(){ $('prog').style.width=(idx/list.length*100)+'%'; }

function renderQuestion(){
  answered=false; currentSel=null; curveState=null;
  const q=list[idx];
  const fb=$('fb'); fb.className='fb'; fb.innerHTML='';
  const btn=$('actionBtn'); btn.className='btn check'; btn.textContent='Comprobar'; btn.disabled=true;
  setProgress();

  let html=`<div class="q-kind">${q.label}${q.step?` · paso ${q.step}`:''}</div>`;
  html+=`<div class="q-text">${q.text}</div>`;
  if(q.context) html+=`<div class="q-context">${q.context}</div>`;

  const isMC = q.kind==='mc' || q.options;
  if(q.kind==='curve'){
    html+=buildCurveSVG(q);
  } else if(isMC){
    const tags=['A','B','C','D'];
    currentOrder = q.options.map((_,i)=>i);
    for(let i=currentOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [currentOrder[i],currentOrder[j]]=[currentOrder[j],currentOrder[i]]; }
    html+=`<div class="opts">`;
    currentOrder.forEach((oi,i)=>{ html+=`<button class="opt" data-i="${i}" onclick="selectOpt(${i})"><span class="tag">${tags[i]}</span>${q.options[oi]}</button>`; });
    html+=`</div>`;
  } else {
    html+=`<div class="numwrap"><input id="numIn" inputmode="decimal" placeholder="0" autocomplete="off" oninput="onNumInput()"><div class="unit-badge">${q.unit||''}</div></div>`;
  }
  $('qArea').innerHTML=html;

  if(q.kind==='curve'){ initCurve(q); btn.disabled=false; }
  if($('numIn')) setTimeout(()=>$('numIn').focus(),120);
}

/* ----- CURVE (leer la curva) ----- */
const CV={W:320,H:248,x0:44,x1:306,y0:208,y1:14};
function buildCurveSVG(q){
  const sx=T=>CV.x0+(T/q.xmax)*(CV.x1-CV.x0);
  const sy=S=>CV.y0-(S/q.ymax)*(CV.y0-CV.y1);
  let g='';
  // grid + ticks
  for(let T=0;T<=q.xmax;T+=q.xmax/3){ const x=sx(T);
    g+=`<line x1="${x.toFixed(1)}" y1="${CV.y1}" x2="${x.toFixed(1)}" y2="${CV.y0}" stroke="#EAEDE7" stroke-width="1"/>`;
    g+=`<text x="${x.toFixed(1)}" y="${CV.y0+15}" font-size="10" text-anchor="middle" fill="#8a948c" font-family="ui-monospace,Menlo,monospace">${T}</text>`; }
  for(let S=0;S<=q.ymax;S+=q.ymax/3){ const y=sy(S);
    g+=`<line x1="${CV.x0}" y1="${y.toFixed(1)}" x2="${CV.x1}" y2="${y.toFixed(1)}" stroke="#EAEDE7" stroke-width="1"/>`;
    g+=`<text x="${CV.x0-6}" y="${(y+3).toFixed(1)}" font-size="10" text-anchor="end" fill="#8a948c" font-family="ui-monospace,Menlo,monospace">${(+S.toFixed(2)).toString().replace('.',',')}</text>`; }
  // axes
  g+=`<line x1="${CV.x0}" y1="${CV.y0}" x2="${CV.x1}" y2="${CV.y0}" stroke="#b7c1b8" stroke-width="1.5"/>`;
  g+=`<line x1="${CV.x0}" y1="${CV.y1}" x2="${CV.x0}" y2="${CV.y0}" stroke="#b7c1b8" stroke-width="1.5"/>`;
  // curve
  const poly=q.points.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  g+=`<polyline points="${poly}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>`;
  q.points.forEach(p=>{ g+=`<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="2.5" fill="var(--primary)"/>`; });
  // target vertical line
  const xL=sx(q.targetT); const startS=q.ymax/2; const hy=sy(startS);
  g+=`<line x1="${xL.toFixed(1)}" y1="${CV.y1}" x2="${xL.toFixed(1)}" y2="${CV.y0}" stroke="var(--clay)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  g+=`<text x="${xL.toFixed(1)}" y="${CV.y1+2}" font-size="10" text-anchor="middle" fill="var(--clay)" font-family="ui-monospace,Menlo,monospace">${q.targetT}°C</text>`;
  // horizontal guide + true point (hidden)
  g+=`<line id="curveGuideH" x1="${CV.x0}" y1="${hy.toFixed(1)}" x2="${xL.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--clay)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`;
  g+=`<circle id="curveTrue" cx="${xL.toFixed(1)}" cy="${sy(q.answer).toFixed(1)}" r="5" fill="none" stroke="#16241E" stroke-width="2" opacity="0"/>`;
  // handle + readout
  g+=`<circle id="curveHandle" cx="${xL.toFixed(1)}" cy="${hy.toFixed(1)}" r="11" fill="var(--clay)" stroke="#fff" stroke-width="2.5"/>`;
  g+=`<text id="curveRead" x="${(xL+10).toFixed(1)}" y="${(hy-9).toFixed(1)}" font-size="13" font-weight="600" fill="#16241E" font-family="ui-monospace,Menlo,monospace">≈ ${startS.toFixed(q.dec||0).replace('.',',')} ${q.yUnit}</text>`;
  g+=`<text x="${((CV.x0+CV.x1)/2).toFixed(1)}" y="${CV.H-4}" font-size="10" text-anchor="middle" fill="#6c7770">${q.xlabel}</text>`;
  return `<div class="curve-wrap"><svg id="curveSvg" viewBox="0 0 ${CV.W} ${CV.H}" style="width:100%;touch-action:none;display:block">${g}</svg></div>
          <div class="curve-hint">Solubilidad (g / 100 g agua) en el eje vertical · arrastrá el punto naranja</div>`;
}
function initCurve(q){
  const sy=S=>CV.y0-(S/q.ymax)*(CV.y0-CV.y1);
  const invS=py=>(CV.y0-py)/(CV.y0-CV.y1)*q.ymax;
  curveState={q,sy,invS,S:q.ymax/2,locked:false};
  const svg=$('curveSvg');
  svg.addEventListener('pointerdown', e=>{ if(curveState.locked) return; curveDrag=true; curveSetS(curveYToS(e.clientY)); e.preventDefault(); });
}
function curveYToS(clientY){
  const svg=$('curveSvg'); const r=svg.getBoundingClientRect();
  const svgY=(clientY-r.top)/r.height*CV.H; return curveState.invS(svgY);
}
function curveSetS(S){
  const cs=curveState; if(!cs) return;
  S=Math.max(0,Math.min(cs.q.ymax,S)); cs.S=S;
  const py=cs.sy(S);
  $('curveHandle').setAttribute('cy',py.toFixed(1));
  const gh=$('curveGuideH'); gh.setAttribute('y1',py.toFixed(1)); gh.setAttribute('y2',py.toFixed(1));
  const rd=$('curveRead'); rd.setAttribute('y', Math.max(20,Math.min(204,py-9)).toFixed(1));
  rd.textContent='≈ '+S.toFixed(cs.q.dec||0).replace('.',',')+' '+cs.q.yUnit;
}
window.addEventListener('pointermove', e=>{ if(curveDrag && curveState && !curveState.locked) curveSetS(curveYToS(e.clientY)); });
window.addEventListener('pointerup', ()=>{ curveDrag=false; });

/* ----- ANSWERS ----- */
function selectOpt(i){
  if(answered) return;
  currentSel=i;
  document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', +o.dataset.i===i));
  $('actionBtn').disabled=false;
}
function onNumInput(){
  const v=$('numIn').value.replace(',','.').trim();
  $('actionBtn').disabled=!(v!=='' && !isNaN(parseFloat(v)));
}
function onAction(){ answered ? advance() : checkAnswer(); }

function checkAnswer(){
  const q=list[idx]; const isMC = q.kind==='mc' || q.options; let correct=false, shown='';
  if(q.kind==='curve'){
    const S=curveState.S; correct=Math.abs(S-q.answer)<=q.tol; curveState.locked=true;
    $('curveHandle').setAttribute('fill', correct?'var(--ok)':'var(--no)');
    $('curveTrue').setAttribute('opacity','1');
    shown='≈ '+String(q.answer).replace('.',',')+' '+q.yUnit;
  } else if(isMC){
    correct = currentOrder[currentSel]===q.answer;
    document.querySelectorAll('.opt').forEach(o=>{ const i=+o.dataset.i; o.style.pointerEvents='none';
      if(currentOrder[i]===q.answer) o.classList.add('correct'); else if(i===currentSel) o.classList.add('wrong'); });
    shown=q.options[q.answer];
  } else {
    const val=parseFloat($('numIn').value.replace(',','.'));
    correct = Math.abs(val-q.answer)<=(q.tol||0.001);
    $('numIn').disabled=true; $('numIn').style.borderColor = correct?'var(--ok)':'var(--no)';
    shown=String(q.answer).replace('.',',')+' '+(q.unit||'');
  }
  answered=true;
  const fb=$('fb');
  if(correct){
    xp+=10; $('xptop').textContent=totalXP+xp; fb.className='fb ok show';
    fb.innerHTML=`<div class="head">&#10003; ¡Correcto! +10 XP</div><div class="why">${q.why}</div>`;
    $('actionBtn').className='btn next-ok';
  } else {
    lives=Math.max(0,lives-1); renderLives(); fb.className='fb no show';
    fb.innerHTML=`<div class="head">&#10007; Respuesta: ${shown}</div><div class="why">${q.why}</div>`;
    $('actionBtn').className='btn next-no';
  }
  $('actionBtn').textContent=(idx===list.length-1)?'Ver resultado':'Continuar';
  $('actionBtn').disabled=false;
  if(lives===0) setTimeout(()=>endLesson(false),0);
}
function advance(){
  if(lives===0){ endLesson(false); return; }
  idx++; if(idx>=list.length){ endLesson(true); return; } renderQuestion();
}

function endLesson(completed){
  totalXP += xp; saved.xp = totalXP; $('xptop').textContent = totalXP;
  if(completed){ saved.done[curUnit] = true; updateStreakOnComplete(); }
  store.save(saved);
  if(completed) $('prog').style.width='100%';
  const correctCount=Math.round(xp/10);
  const acc=Math.round(correctCount/list.length*100);
  const uname=(UNITS.find(u=>u.id===curUnit)||{}).name||'';
  const flask=`<svg width="92" height="100" viewBox="0 0 92 100" style="margin-bottom:18px">
    <path d="M37 8 v26 L14 84 a8 8 0 0 0 7 12 h50 a8 8 0 0 0 7-12 L55 34 V8" fill="none" stroke="#16241E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M27 64 L65 64 L74 80 a8 8 0 0 1 -7 12 H25 a8 8 0 0 1 -7-12 Z" fill="${completed?'#15795F':'#D7493A'}" opacity=".9"/>
    <line x1="33" y1="8" x2="59" y2="8" stroke="#16241E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="74" r="3" fill="#fff" opacity=".7"/><circle cx="55" cy="82" r="2.5" fill="#fff" opacity=".6"/></svg>`;
  const inner = completed ? `${flask}
    <div class="sum-title">¡Unidad completa!</div>
    <div class="sum-sub">Terminaste ${uname}</div>
    <div class="stat-row">
      <div class="stat xp"><div class="v">${xp}</div><div class="l">XP</div></div>
      <div class="stat acc"><div class="v">${acc}%</div><div class="l">Aciertos</div></div>
      <div class="stat hp"><div class="v">${lives}</div><div class="l">Vidas</div></div>
    </div>
    <button class="btn check" style="max-width:320px" onclick="renderMap();show('screen-map')">Volver al mapa</button>`
  : `${flask}
    <div class="sum-title gameover">Te quedaste sin vidas</div>
    <div class="sum-sub">Repasá y volvé a intentar — sin penalización</div>
    <div class="stat-row">
      <div class="stat xp"><div class="v">${xp}</div><div class="l">XP</div></div>
      <div class="stat acc"><div class="v">${correctCount}/${list.length}</div><div class="l">Acertadas</div></div>
    </div>
    <button class="btn check" style="max-width:320px" onclick="startLesson('${curUnit}')">Reintentar</button>`;
  $('sumInner').innerHTML=inner; show('screen-sum');
}

/* offline: registrar service worker (solo funciona servido por https, ej. GitHub Pages) */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }

/* init */
$('streak').textContent = streakVal;
$('xptop').textContent = totalXP;
renderMap(); renderLives();
</script>
</body>
</html>
